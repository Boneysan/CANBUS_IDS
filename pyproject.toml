[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "can-ids"
version = "1.0.0"
description = "Real-time intrusion detection system for CAN bus networks"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Mike Zomer"},
]
keywords = [
    "can-bus",
    "intrusion-detection",
    "automotive-security",
    "industrial-security",
    "anomaly-detection",
    "machine-learning",
    "raspberry-pi",
    "socketcan",
    "cybersecurity",
    "network-security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: Console",
]
dependencies = [
    "python-can>=4.0.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "joblib>=1.3.0",
    "psutil>=5.8.0",
    "PyYAML>=6.0",
    "colorlog>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "pytest-mock>=3.6",
    "black>=21.0",
    "flake8>=3.8",
    "isort>=5.9",
    "mypy>=0.910",
    "bandit>=1.7",
]
raspberry-pi = [
    "RPi.GPIO>=0.7.0",
    "gpiozero>=1.6.0",
]
webhook = [
    "requests>=2.25.0",
]
all = [
    "RPi.GPIO>=0.7.0",
    "gpiozero>=1.6.0",
    "requests>=2.25.0",
]

[project.urls]
Homepage = "https://github.com/Boneysan/CANBUS_IDS"
"Bug Reports" = "https://github.com/Boneysan/CANBUS_IDS/issues"
Source = "https://github.com/Boneysan/CANBUS_IDS"
Documentation = "https://github.com/Boneysan/CANBUS_IDS/tree/main/docs"

[project.scripts]
can-ids = "main:main"
canids = "main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests",
    "requires_hardware: marks tests requiring CAN hardware",
    "slow: marks tests as slow",
]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
